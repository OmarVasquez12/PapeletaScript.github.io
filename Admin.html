<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Lua Master</title>
    <!-- Importamos una fuente moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #050507;
            --bg-card: rgba(20, 10, 10, 0.6);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --bg-glass-strong: rgba(20, 10, 10, 0.85);
            --primary: #ff1a1a;
            --primary-glow: rgba(255, 26, 26, 0.4);
            --secondary: #cc1b1b;
            --success: #00ff44;
            --danger: #ff0000;
            --discord-blue: #5865F2;
            --text-main: #ffffff;
            --text-muted: #9496a1;
            --text-dim: #6b7280;
            --border-color: rgba(255, 26, 26, 0.15);
            --border-hover: rgba(255, 26, 26, 0.3);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --container-width: 1400px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            /* Fondo sutil con gradiente radial para profundidad */
            background-image: radial-gradient(circle at 50% 0%, #2a0505 0%, var(--bg-body) 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-container {
            width: 100%;
            max-width: 450px; /* Ancho contenido para lista vertical */
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(255, 26, 26, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Efecto de brillo superior */
        .admin-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.7;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-main);
            text-shadow: 0 0 15px var(--primary-glow);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 300;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-admin {
            position: relative;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 18px 25px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            text-decoration: none;
        }

        /* Iconos SVG simples */
        .btn-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            margin-right: 15px;
        }

        .btn-content {
            display: flex;
            align-items: center;
        }

        /* Hover Effects */
        .btn-admin:hover {
            background: rgba(255, 26, 26, 0.08);
            border-color: var(--primary);
            transform: translateX(5px);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-admin:hover .btn-icon {
            opacity: 1;
            fill: var(--primary);
            filter: drop-shadow(0 0 5px var(--primary));
        }

        .btn-arrow {
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
            color: var(--primary);
        }

        .btn-admin:hover .btn-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* Estilo especial para Server.lua (El último) */
        .btn-special {
            margin-top: 10px;
            background: linear-gradient(45deg, rgba(20, 10, 10, 0.9), rgba(60, 10, 10, 0.9));
            border: 1px solid var(--secondary);
        }

        .btn-special:hover {
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            color: white;
            border-color: transparent;
        }
        
        .btn-special:hover .btn-icon {
            fill: white;
            filter: none;
        }

        /* Animación de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-admin {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }

        .btn-admin:nth-child(1) { animation-delay: 0.1s; }
        .btn-admin:nth-child(2) { animation-delay: 0.2s; }
        .btn-admin:nth-child(3) { animation-delay: 0.3s; }
        .btn-admin:nth-child(4) { animation-delay: 0.4s; }
        .btn-admin:nth-child(5) { animation-delay: 0.5s; }
        .btn-admin:nth-child(6) { animation-delay: 0.6s; }
        .btn-admin:nth-child(7) { animation-delay: 0.7s; }

    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>Panel de Control</h1>
            <p class="subtitle">Administración del Servidor & Scripts</p>
        </header>

        <nav class="menu-list">
            <!-- Botón 1 -->
            <button class="btn-admin">
                <div class="btn-content">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                    Subir Archivo
                </div>
                <span class="btn-arrow">➜</span>
            </button>

            <!-- Botón 2 -->
            <button class="btn-admin">
                <div class="btn-content">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    Usuarios
                </div>
                <span class="btn-arrow">➜</span>
            </button>

            <!-- Botón 3 -->
            <button class="btn-admin">
                <div class="btn-content">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                    Licencias Usuario
                </div>
                <span class="btn-arrow">➜</span>
            </button>

            <!-- Botón 4 -->
            <button class="btn-admin">
                <div class="btn-content">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                    Encriptador Lua
                </div>
                <span class="btn-arrow">➜</span>
            </button>

            <!-- Botón 5 -->
            <button class="btn-admin">
                <div class="btn-content">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    Pasar a Usuarios
                </div>
                <span class="btn-arrow">➜</span>
            </button>

            <!-- Botón 6 -->
            <button class="btn-admin">
                <div class="btn-content">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    Gestión de Roles
                </div>
                <span class="btn-arrow">➜</span>
            </button>

            <!-- Botón 7 (Especial) -->
            <button class="btn-admin btn-special">
                <div class="btn-content">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                    Server.lua
                </div>
                <span class="btn-arrow">⚡</span>
            </button>
        </nav>
    </div>

</body>
</html>
