<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Papeleta Store</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff1a1a'/%3E%3Cstop offset='1' stop-color='%23cc1b1b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='70' font-family='Arial, sans-serif' font-size='58' font-weight='900' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-body: #050507; --primary: #ff1a1a; --border-color: rgba(255, 26, 26, 0.15); }
        body { background-color: #050507; color: #f3f4f6; font-family: 'Segoe UI', system-ui, sans-serif; }
        .red-glow { text-shadow: 0 0 18px rgba(255, 26, 26, 0.85); }
        .cart-item { background: rgba(21, 10, 10, 0.6); border: 1px solid rgba(255, 26, 26, 0.15); transition: all 0.3s ease; }
        .cart-item:hover { border-color: rgba(255, 26, 26, 0.4); }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: rgba(21, 10, 10, 0.95); border: 1px solid rgba(255, 26, 26, 0.3); border-left: 4px solid #dc2626; border-radius: 12px; padding: 16px 20px; min-width: 320px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); animation: slideInRight 0.4s ease, fadeOut 0.4s ease 4.6s forwards; display: flex; align-items: center; gap: 12px; pointer-events: auto; }
        .toast.success { border-left-color: #10b981; }
        .toast.error { border-left-color: #ef4444; }
        .toast.warning { border-left-color: #f59e0b; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateX(100%); } }
        
        /* Estilos específicos para el resumen del pedido */
        .order-summary-box {
            background: linear-gradient(180deg, rgba(20, 5, 5, 0.95) 0%, rgba(10, 5, 5, 0.98) 100%);
            border: 1px solid rgba(255, 26, 26, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .input-dark {
            background: rgba(13, 5, 5, 0.8);
            border: 1px solid rgba(255, 26, 26, 0.3);
            color: #fff;
        }
        .input-dark::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .input-dark:focus {
            outline: none;
            border-color: #ff1a1a;
            box-shadow: 0 0 0 3px rgba(255, 26, 26, 0.1);
        }
        .btn-aplicar {
            background: linear-gradient(135deg, #ff1a1a 0%, #cc0000 100%);
            box-shadow: 0 4px 15px rgba(255, 26, 26, 0.4);
        }
        .btn-aplicar:hover {
            background: linear-gradient(135deg, #ff3333 0%, #ff1a1a 100%);
            box-shadow: 0 6px 20px rgba(255, 26, 26, 0.6);
        }
        .select-dark {
            background: rgba(13, 5, 5, 0.8);
            border: 1px solid rgba(255, 26, 26, 0.3);
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            appearance: none; /* Para personalizar la flecha si se desea */
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ff1a1a%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
        }
        .select-dark:focus {
            outline: none;
            border-color: #ff1a1a;
        }
        .checkbox-custom {
            accent-color: #ff1a1a;
        }
        .warning-box {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(245, 158, 11, 0.05) 100%);
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.1);
        }
        .total-price {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }
        .commission-text {
            color: #fbbf24; /* Amarillo dorado como en la imagen */
            font-weight: bold;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }
        .btn-finalizar {
            background: linear-gradient(135deg, #cc0000 0%, #990000 100%);
            box-shadow: 0 4px 20px rgba(204, 0, 0, 0.4);
        }
        .btn-finalizar:hover:not(:disabled) {
            background: linear-gradient(135deg, #ff1a1a 0%, #cc0000 100%);
            box-shadow: 0 6px 25px rgba(255, 26, 26, 0.6);
            transform: translateY(-1px);
        }
        .btn-finalizar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .divider {
            border-top: 1px solid rgba(255, 26, 26, 0.15);
        }
        
        /* Animación suave para mostrar elementos */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- HEADER SIMPLIFICADO -->
    <header class="bg-[#0d0505]/90 backdrop-blur border-b border-red-900/30 sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-red-500 to-red-800 flex items-center justify-center font-black text-white">P</div>
            <span class="text-white font-black tracking-widest text-lg">PAPELETA <span class="text-red-400">STORE</span></span>
        </a>
        <a href="index.html" class="text-gray-400 hover:text-white flex items-center gap-2 transition-colors text-sm font-semibold">
            <i class="fas fa-arrow-left"></i> Volver a la Tienda
        </a>
    </header>

    <!-- CONTENIDO PRINCIPAL DEL CARRITO -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-6 py-12">
        <h1 class="text-3xl md:text-4xl font-black text-white uppercase tracking-tight mb-8 flex items-center gap-3">
            <i class="fas fa-shopping-cart text-red-500"></i> Mi Carrito
        </h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- LISTA DE PRODUCTOS -->
            <div class="lg:col-span-2 space-y-4" id="cart-items-container">
                <!-- Se llena con JS -->
            </div>

            <!-- RESUMEN DEL PEDIDO (ESTILO DE LA IMAGEN) -->
            <div class="lg:col-span-1">
                <div class="order-summary-box rounded-2xl p-6 sticky top-24">
                    <h2 class="text-2xl font-black text-white mb-6 tracking-tight">Resumen de la Orden</h2>
                    
                    <!-- Input de Descuento -->
                    <div class="mb-6">
                        <label class="block text-gray-400 text-sm mb-2">¿Tienes un cupón de descuento?</label>
                        <div id="discount-input-container" class="flex gap-0 rounded-lg overflow-hidden">
                            <input type="text" id="discount-code-input" placeholder="Cupón de descuento" 
                                class="flex-1 input-dark px-4 py-3 text-sm uppercase rounded-l-lg">
                            <button onclick="validateAndApplyDiscount()" class="btn-aplicar text-white px-6 py-3 text-sm font-bold uppercase tracking-wide transition-all rounded-r-lg">
                                Aplicar
                            </button>
                        </div>
                        <div id="discount-applied" class="hidden mt-3 p-3 bg-green-900/20 border border-green-600/30 rounded-lg flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-tag text-green-400"></i>
                                <span class="text-green-400 text-sm font-semibold" id="discount-code-text"></span>
                            </div>
                            <button onclick="removeDiscountCode()" class="text-gray-400 hover:text-red-400 text-sm"><i class="fas fa-times"></i></button>
                        </div>
                    </div>

                    <!-- Método de Pago -->
                    <div class="mb-6">
                        <label class="block text-gray-400 text-sm mb-2">Método de pago</label>
                        <select id="payment-method" onchange="handlePaymentMethodChange()" class="select-dark w-full px-4 py-3 rounded-lg text-sm">
                            <option value="" disabled selected>Seleccione el método</option>
                            <option value="paypal">PayPal</option>
                            <option value="credit_card">Tarjeta de Crédito / Débito</option>
                            <option value="discord">Pago Manual (Discord)</option>
                        </select>
                    </div>

                    <!-- Formulario de Tarjeta (Oculto por defecto) -->
                    <div id="credit-card-form" class="hidden mb-6 fade-in p-4 bg-[#0d0505] border border-red-900/30 rounded-xl">
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs text-gray-500 block mb-1">Nombre en la tarjeta</label>
                                <input type="text" placeholder="Como aparece en la tarjeta" class="input-dark w-full px-3 py-2 rounded text-sm">
                            </div>
                            <div>
                                <label class="text-xs text-gray-500 block mb-1">Número de tarjeta</label>
                                <div class="relative">
                                    <input type="text" placeholder="0000 0000 0000 0000" class="input-dark w-full pl-3 pr-10 py-2 rounded text-sm">
                                    <i class="fas fa-credit-card absolute right-3 top-2.5 text-gray-500"></i>
                                </div>
                            </div>
                            <div class="flex gap-3">
                                <div class="flex-1">
                                    <label class="text-xs text-gray-500 block mb-1">Vencimiento</label>
                                    <input type="text" placeholder="MM/AA" class="input-dark w-full px-3 py-2 rounded text-sm text-center">
                                </div>
                                <div class="flex-1">
                                    <label class="text-xs text-gray-500 block mb-1">CVV</label>
                                    <input type="password" placeholder="123" class="input-dark w-full px-3 py-2 rounded text-sm text-center">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Términos y Condiciones -->
                    <div class="mb-6 divider pt-6">
                        <label class="flex items-start gap-3 cursor-pointer group">
                            <input type="checkbox" id="terms-checkbox" class="checkbox-custom mt-1 w-4 h-4 rounded border-red-900/50">
                            <span class="text-sm text-gray-400 group-hover:text-gray-300 transition-colors">
                                Acepto los <a href="#" class="text-red-500 hover:text-red-400 underline">Términos de uso</a> y la <a href="#" class="text-red-500 hover:text-red-400 underline">Política de privacidad</a>.
                            </span>
                        </label>
                    </div>

                    <!-- Totales -->
                    <div class="space-y-3 mb-6 divider pt-6">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">Subtotal:</span>
                            <span id="cart-subtotal" class="text-white">$0.00</span>
                        </div>
                        
                        <!-- Línea de comisión PayPal -->
                        <div id="paypal-commission-line" class="hidden flex justify-between text-sm">
                            <span class="text-gray-400">Comisión de PayPal:</span>
                            <span id="paypal-commission-amount" class="commission-text">+$0.00</span>
                        </div>

                        <div id="discount-line" class="hidden flex justify-between text-sm">
                            <span class="text-green-400">Descuento:</span>
                            <span id="discount-amount" class="text-green-400">-$0.00</span>
                        </div>

                        <div class="flex justify-between items-center pt-3 border-t border-red-900/30">
                            <span class="text-gray-300 font-semibold text-lg">Total parcial</span>
                            <span id="cart-total" class="text-3xl font-black total-price">$ 0.00</span>
                        </div>
                    </div>

                    <!-- Alerta de Login -->
                    <div id="login-warning" class="warning-box rounded-xl p-4 mb-6 hidden">
                        <div class="flex items-start gap-3">
                            <i class="fas fa-user-lock text-yellow-500 text-xl mt-0.5"></i>
                            <div>
                                <p class="text-yellow-400 font-bold text-sm mb-1">Inicia una sesión para continuar</p>
                                <p class="text-yellow-600/80 text-xs">Necesitas una factura para realizar la compra.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Contenedor Botones PayPal (oculto inicialmente) -->
                    <div id="paypal-button-container" class="mb-3 hidden"></div>

                    <!-- Botón Finalizar Compra -->
                    <button id="finalize-btn" onclick="finalizePurchase()" disabled class="btn-finalizar w-full text-white font-black py-4 rounded-xl flex items-center justify-center gap-3 transition-all uppercase tracking-wide text-lg mb-3">
                        <i class="fas fa-lock"></i> Finalizar la Compra
                    </button>
                    
                    <button id="continue-shopping-btn" onclick="window.location.href='index.html'" class="w-full bg-transparent border border-red-900/30 hover:bg-red-950/20 text-gray-400 hover:text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2 transition-all">
                        <i class="fas fa-arrow-left"></i> Sigue comprando
                    </button>
                    
                    <p class="text-gray-600 text-xs text-center mt-4 flex items-center justify-center gap-1">
                        <i class="fas fa-shield-alt"></i> Pago seguro y entrega instantánea
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // ========== CONFIGURACIÓN ==========
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1530402751375216720/CM6vWGEYqf3aWPiCmIBf_ycp29k686sO6Fc9HB4wisAZTAGe3OiRt5OKZoxbsINHvjgq";
        const firebaseConfig = {
            apiKey: "AIzaSyBWggE0KFiVZDxwxvmhuWXEKu6bNguV0mM",
            authDomain: "papeletalicencia.firebaseapp.com",
            databaseURL: "https://papeletalicencia-default-rtdb.firebaseio.com",
            projectId: "papeletalicencia",
            storageBucket: "papeletalicencia.firebasestorage.app",
            messagingSenderId: "677208314051",
            appId: "1:677208314051:web:a27c04f31d402e83f29276",
            measurementId: "G-RPJ4KQ6EQ4"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cart = JSON.parse(localStorage.getItem('papeleta_cart') || '[]');
        let currentUser = null;
        let activeDiscount = null;
        let discountPercentage = 0;

        // ========== UTILIDADES ==========
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
            const titles = { success: '¡Éxito!', error: 'Error', warning: 'Advertencia' };
            toast.innerHTML = `
                <i class="fas ${icons[type]} text-xl" style="color: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#f59e0b'}"></i>
                <div class="flex-1">
                    <div class="font-semibold text-sm text-white">${titles[type]}</div>
                    <div class="text-xs text-gray-400">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, tag => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[tag] || tag));
        }

        // ========== LÓGICA DEL CARRITO ==========
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-[#150a0a] border border-red-900/30 rounded-2xl">
                        <i class="fas fa-shopping-cart text-gray-600 text-5xl mb-4"></i>
                        <h3 class="text-white text-xl font-bold mb-2">Tu carrito está vacío</h3>
                        <p class="text-gray-400 mb-6">Agrega productos para comenzar</p>
                        <a href="index.html" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-xl transition-all inline-flex items-center gap-2">
                            <i class="fas fa-arrow-left"></i> Volver a la Tienda
                        </a>
                    </div>
                `;
                updateTotals();
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item rounded-xl p-4 flex items-center gap-4">
                    <img src="${escapeHTML(item.image || '')}" alt="${escapeHTML(item.name)}" class="w-20 h-20 object-cover rounded-lg bg-[#0d0505]">
                    <div class="flex-grow min-w-0">
                        <h4 class="text-white font-bold text-lg truncate">${escapeHTML(item.name)}</h4>
                        <p class="${Number(item.price) === 0 ? 'text-green-400' : 'text-red-400'} font-bold text-xl">
                            ${Number(item.price) === 0 ? 'GRATIS' : '$' + Number(item.price).toFixed(2)}
                        </p>
                    </div>
                    <button onclick="removeFromCart('${item.id}')" class="text-gray-500 hover:text-red-400 w-10 h-10 rounded-lg hover:bg-red-950/30 flex items-center justify-center transition-all">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');

            updateTotals();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            localStorage.setItem('papeleta_cart', JSON.stringify(cart));
            renderCart();
            showToast('Producto eliminado del carrito', 'success');
        }

        function handlePaymentMethodChange() {
            const method = document.getElementById('payment-method').value;
            const ccForm = document.getElementById('credit-card-form');
            const paypalContainer = document.getElementById('paypal-button-container');
            const finalizeBtn = document.getElementById('finalize-btn');

            // Reset visibilidad
            ccForm.classList.add('hidden');
            paypalContainer.classList.add('hidden');
            paypalContainer.innerHTML = ''; // Limpiar botones de paypal
            
            // Mostrar botón finalizar por defecto (excepto si es paypal)
            finalizeBtn.classList.remove('hidden');

            if (method === 'credit_card') {
                ccForm.classList.remove('hidden');
            } else if (method === 'paypal') {
                // Renderizar botones de PayPal cuando se selecciona
                renderPayPalButtons();
                paypalContainer.classList.remove('hidden');
                // Ocultar el botón rojo de finalizar si usamos PayPal directo
                finalizeBtn.classList.add('hidden');
            }
        }

        function updateTotals() {
            const subtotal = cart.reduce((sum, item) => sum + Number(item.price), 0);
            const subtotalEl = document.getElementById('cart-subtotal');
            const totalEl = document.getElementById('cart-total');
            const discountLine = document.getElementById('discount-line');
            const discountAmountEl = document.getElementById('discount-amount');
            const discountApplied = document.getElementById('discount-applied');
            const discountCodeText = document.getElementById('discount-code-text');
            const loginWarning = document.getElementById('login-warning');
            const finalizeBtn = document.getElementById('finalize-btn');
            const termsCheckbox = document.getElementById('terms-checkbox');
            
            // Elementos de comisión
            const commissionLine = document.getElementById('paypal-commission-line');
            const commissionAmountEl = document.getElementById('paypal-commission-amount');

            subtotalEl.textContent = '$' + subtotal.toFixed(2);

            let displayTotal = subtotal;
            let commissionAmount = 0;

            // Calcular Descuento
            if (activeDiscount && discountPercentage > 0 && subtotal > 0) {
                const discountAmount = subtotal * (discountPercentage / 100);
                displayTotal = subtotal - discountAmount;
                
                discountLine.classList.remove('hidden');
                discountAmountEl.textContent = '-$' + discountAmount.toFixed(2);
                
                discountApplied.classList.remove('hidden');
                discountCodeText.textContent = `${activeDiscount} (-${discountPercentage}%)`;
            } else {
                discountLine.classList.add('hidden');
                discountApplied.classList.add('hidden');
            }

            // Calcular Comisión PayPal (Solo si el método seleccionado es PayPal)
            const selectedMethod = document.getElementById('payment-method').value;
            
            if (selectedMethod === 'paypal' && subtotal > 0) {
                // Fórmula aproximada de PayPal: 5.4% + $0.30
                commissionAmount = (subtotal * 0.054) + 0.30;
                commissionLine.classList.remove('hidden');
                commissionAmountEl.textContent = '+$' + commissionAmount.toFixed(2);
                
                // Sumar comisión al total
                displayTotal += commissionAmount;
            } else {
                commissionLine.classList.add('hidden');
            }

            totalEl.textContent = '$ ' + displayTotal.toFixed(2);

            // Mostrar/ocultar advertencia de login
            if (!currentUser) {
                loginWarning.classList.remove('hidden');
                finalizeBtn.disabled = true;
            } else {
                loginWarning.classList.add('hidden');
                // Habilitar botón solo si hay términos aceptados
                finalizeBtn.disabled = !termsCheckbox.checked || cart.length === 0;
            }

            // Actualizar estado del botón al cambiar checkbox
            termsCheckbox.onchange = () => {
                finalizeBtn.disabled = !termsCheckbox.checked || cart.length === 0 || !currentUser;
            };
        }

        // Escuchar cambios en el método de pago para recalcular totales (comisión)
        document.getElementById('payment-method').addEventListener('change', updateTotals);

        // ========== CÓDIGOS DE DESCUENTO ==========
        async function validateAndApplyDiscount() {
            const code = document.getElementById('discount-code-input').value.trim().toUpperCase();
            if (!code) { showToast('Ingresa un código', 'warning'); return; }

            try {
                const discountDoc = await db.collection("DiscountCodes").doc(code).get();
                if (!discountDoc.exists) { showToast('Código inválido', 'error'); return; }

                const discountData = discountDoc.data();
                if (!discountData.active) { showToast('Este código ha expirado', 'error'); return; }

                activeDiscount = code;
                discountPercentage = discountData.percentage || 0;
                
                showToast(`¡Código ${code} aplicado! ${discountPercentage}% de descuento`, 'success');
                updateTotals();
            } catch (error) {
                console.error(error);
                showToast('Error al validar el código', 'error');
            }
        }

        function removeDiscountCode() {
            activeDiscount = null;
            discountPercentage = 0;
            document.getElementById('discount-code-input').value = '';
            updateTotals();
            showToast('Código de descuento eliminado', 'success');
        }

        // ========== PROCESO DE PAGO ==========
        function renderPayPalButtons() {
            const container = document.getElementById('paypal-button-container');
            container.innerHTML = ''; 
            if (cart.length === 0) return;
            
            const subtotal = cart.reduce((sum, item) => sum + Number(item.price), 0);
            let totalAmount = subtotal;
            
            // Recalcular total para PayPal incluyendo comisión
            if (activeDiscount && discountPercentage > 0) {
                totalAmount = subtotal - (subtotal * (discountPercentage / 100));
            }
            // Agregar comisión
            const commission = (totalAmount * 0.054) + 0.30;
            totalAmount += commission;
            
            totalAmount = totalAmount.toFixed(2);

            paypal.Buttons({
                style: { shape: 'rect', color: 'gold', layout: 'vertical', label: 'pay' },
                createOrder: function(data, actions) { 
                    return actions.order.create({ 
                        purchase_units: [{ 
                            description: 'Compra en Papeleta Store', 
                            amount: { value: totalAmount } 
                        }] 
                    }); 
                },
                onApprove: function(data, actions) {
                    return actions.order.capture().then(function(details) {
                        showToast('¡Pago completado!', 'success');
                        assignProductsToUserAfterPayment(details);
                        cart = [];
                        localStorage.setItem('papeleta_cart', JSON.stringify(cart));
                        renderCart();
                    });
                }
            }).render('#paypal-button-container');
        }

        async function finalizePurchase() {
            if (!currentUser) {
                showToast('Debes iniciar sesión para continuar', 'error');
                return;
            }

            if (!document.getElementById('terms-checkbox').checked) {
                showToast('Debes aceptar los términos y condiciones', 'warning');
                return;
            }

            const paymentMethod = document.getElementById('payment-method').value;
            
            if (!paymentMethod) {
                showToast('Selecciona un método de pago', 'warning');
                return;
            }

            if (paymentMethod === 'credit_card') {
                // Simulación de procesamiento de tarjeta
                const btn = document.getElementById('finalize-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';
                btn.disabled = true;

                setTimeout(async () => {
                    // Simular éxito
                    const mockPaymentDetails = {
                        id: 'MOCK_CC_' + Date.now(),
                        payer: { email_address: 'cliente@ejemplo.com' }
                    };
                    await assignProductsToUserAfterPayment(mockPaymentDetails);
                    cart = [];
                    localStorage.setItem('papeleta_cart', JSON.stringify(cart));
                    renderCart();
                    showToast('¡Pago con tarjeta exitoso!', 'success');
                    btn.innerHTML = originalText;
                }, 2000);

            } else if (paymentMethod === 'discord') {
                checkoutManual();
            } else {
                showToast('Por favor usa el botón dorado de PayPal', 'warning');
            }
        }

        async function claimFreeProducts() {
            if (cart.length === 0) return;
            const allFree = cart.every(item => Number(item.price) === 0);
            if (!allFree) { showToast('Algunos productos no son gratis', 'error'); return; }
            
            try {
                const purchaseData = {
                    discord_id: currentUser.id, username: currentUser.username, avatar: currentUser.avatar,
                    products: cart.map(item => ({ id: item.id, name: item.name, price: "Gratis" })),
                    total_price: "Gratis", date: firebase.firestore.FieldValue.serverTimestamp(), status: "Reclamado Exitosamente",
                    productImage: cart[0]?.image || null
                };
                
                await db.collection("Clientes").add(purchaseData);
                await sendDiscordNotification(purchaseData, true);
                
                for (const item of cart) { 
                    await getOrCreateLicense(currentUser.id, item.id, item.name); 
                }
                
                showToast('¡Productos reclamados exitosamente!', 'success');
                cart = [];
                localStorage.setItem('papeleta_cart', JSON.stringify(cart));
                renderCart();
            } catch (error) { 
                console.error(error); 
                showToast('Error al registrar la reclamación: ' + error.message, 'error'); 
            }
        }

        async function assignProductsToUserAfterPayment(paymentDetails) {
            try {
                const subtotal = cart.reduce((sum, item) => sum + Number(item.price), 0);
                let total = subtotal;
                let discountInfo = '';
                
                if (activeDiscount && discountPercentage > 0) {
                    total = subtotal - (subtotal * (discountPercentage / 100));
                    discountInfo = ` (Código: ${activeDiscount}, -${discountPercentage}%)`;
                }
                
                // Si fue PayPal, agregar comisión al registro
                const selectedMethod = document.getElementById('payment-method').value;
                if (selectedMethod === 'paypal') {
                    const commission = (total * 0.054) + 0.30;
                    total += commission;
                }

                const purchaseData = {
                    discord_id: currentUser.id, username: currentUser.username, avatar: currentUser.avatar,
                    products: cart.map(item => ({ id: item.id, name: item.name, price: "$" + Number(item.price).toFixed(2) })),
                    total_price: "$" + total.toFixed(2) + discountInfo,
                    payment_id: paymentDetails.id, payer_email: paymentDetails.payer.email_address,
                    date: firebase.firestore.FieldValue.serverTimestamp(), status: "Pagado",
                    productImage: cart[0]?.image || null,
                    discount_code: activeDiscount,
                    discount_percentage: discountPercentage
                };
                
                await db.collection("Clientes").add(purchaseData);
                await sendDiscordNotification(purchaseData, false);
                
                for (const item of cart) { 
                    await getOrCreateLicense(currentUser.id, item.id, item.name); 
                }
                
                showToast("¡Productos añadidos a tu biblioteca!", 'success');
            } catch (error) { 
                console.error(error); 
                showToast('Error al registrar la compra: ' + error.message, 'error'); 
            }
        }

        function checkoutManual() {
            if (cart.length === 0) return;
            showToast('Serás redirigido a Discord para coordinar el pago manual.', 'warning');
            setTimeout(() => { window.open('https://discord.gg/rvxEdWcGkf', '_blank'); }, 1500);
        }

        // ========== LICENCIAS Y NOTIFICACIONES ==========
        async function getOrCreateLicense(userId, productId, productName) {
            try {
                const querySnapshot = await db.collection("Licencias")
                    .where("discord_id", "==", userId)
                    .where("product_id", "==", productId)
                    .where("status", "==", "active")
                    .limit(1).get();

                if (!querySnapshot.empty) return querySnapshot.docs[0].data();

                const newUser = "USER_" + Math.random().toString(36).substring(2, 8).toUpperCase();
                const newKey = Array.from({length: 24}, () => "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[Math.floor(Math.random() * 36)]).join('');

                const licenseData = { 
                    discord_id: userId, username: currentUser.username, product_id: productId, product_name: productName, 
                    user_code: newUser, key: newKey, created_at: firebase.firestore.FieldValue.serverTimestamp(), status: 'active' 
                };
                
                await db.collection("Licencias").add(licenseData);
                return { id: docRef.id, ...licenseData };
            } catch (error) {
                console.error("Error en getOrCreateLicense:", error);
                return null;
            }
        }

        async function sendDiscordNotification(purchaseData, isFree = false) {
            try {
                const productNames = purchaseData.products.map(p => p.name).join(', ');
                const priceText = isFree ? "GRATIS" : (purchaseData.total_price || "$0.00");
                const methodText = isFree ? "Reclamo Gratis" : "PayPal/Tarjeta";
                const embedColor = isFree ? 5763719 : 16711680;

                const payload = {
                    username: "Papeleta Store",
                    avatar_url: "https://cdn.discordapp.com/embed/avatars/0.png",
                    embeds: [{
                        title: isFree ? "🎁 Producto reclamado" : "✅ Compra completada",
                        description: isFree ? `Se reclamó un producto gratuito.` : `Tu compra fue procesada correctamente.`,
                        color: embedColor,
                        fields: [
                            { name: " Cliente", value: `<@${purchaseData.discord_id}> (**${purchaseData.username}**)`, inline: true },
                            { name: "📦 Producto", value: productNames || "Sin nombre", inline: true },
                            { name: "💳 Método", value: methodText, inline: true },
                            { name: "💰 Precio", value: `**${priceText}**`, inline: true }
                        ],
                        footer: { text: "Papeleta Store • " + new Date().toLocaleString('es-ES') },
                        timestamp: new Date().toISOString()
                    }]
                };

                if (purchaseData.productImage && (purchaseData.productImage.startsWith('http://') || purchaseData.productImage.startsWith('https://'))) {
                    payload.embeds[0].image = { url: purchaseData.productImage };
                }

                await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            } catch (error) {
                console.error('❌ Error en notificación:', error);
            }
        }

        // ========== INICIALIZACIÓN ==========
        document.addEventListener('DOMContentLoaded', () => {
            // Verificar si hay usuario
            const savedToken = localStorage.getItem('dc_access_token');
            if (savedToken) {
                fetch('https://discord.com/api/users/@me', { headers: { 'Authorization': `Bearer ${savedToken}` }})
                .then(res => res.json())
                .then(user => {
                    currentUser = user;
                    renderCart();
                })
                .catch(() => {
                    renderCart();
                    showToast('Debes iniciar sesión para completar la compra', 'warning');
                });
            } else {
                renderCart();
                showToast('Debes iniciar sesión para completar la compra', 'warning');
            }
        });
    </script>
</body>
