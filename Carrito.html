<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Papeleta Store</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff1a1a'/%3E%3Cstop offset='1' stop-color='%23cc1b1b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='70' font-family='Arial, sans-serif' font-size='58' font-weight='900' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDKs Externos -->
    <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        /* Estilos Personalizados para igualar las capturas */
        :root { 
            --bg-body: #050507; 
            --primary: #ff1a1a; 
            --border-color: rgba(255, 26, 26, 0.15); 
        }
        body { 
            background-color: var(--bg-body); 
            color: #f3f4f6; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
        }
        
        /* Efecto Glow Rojo */
        .red-glow { text-shadow: 0 0 18px rgba(255, 26, 26, 0.85); }
        
        /* Tarjetas del Carrito */
        .cart-item { 
            background: rgba(21, 10, 10, 0.6); 
            border: 1px solid rgba(255, 26, 26, 0.15); 
            transition: all 0.3s ease; 
        }
        .cart-item:hover { 
            border-color: rgba(255, 26, 26, 0.4); 
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.1);
        }

        /* Toast Notifications */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { 
            background: rgba(21, 10, 10, 0.95); 
            border: 1px solid rgba(255, 26, 26, 0.3); 
            border-left: 4px solid #dc2626; 
            border-radius: 12px; 
            padding: 16px 20px; 
            min-width: 320px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); 
            animation: slideInRight 0.4s ease, fadeOut 0.4s ease 4.6s forwards; 
            display: flex; align-items: center; gap: 12px; pointer-events: auto; 
        }
        .toast.success { border-left-color: #10b981; }
        .toast.error { border-left-color: #ef4444; }
        .toast.warning { border-left-color: #f59e0b; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateX(100%); } }

        /* Inputs personalizados */
        .custom-input:focus { border-color: #ff1a1a; box-shadow: 0 0 0 2px rgba(255, 26, 26, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-[#0d0505]/90 backdrop-blur-md border-b border-red-900/30 sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity group">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-red-600 to-red-900 flex items-center justify-center font-black text-white shadow-lg shadow-red-900/20 group-hover:shadow-red-600/40 transition-all">P</div>
            <span class="text-white font-black tracking-widest text-lg">PAPELETA <span class="text-red-500">STORE</span></span>
        </a>
        <a href="index.html" class="text-gray-400 hover:text-white flex items-center gap-2 transition-colors text-sm font-semibold bg-white/5 hover:bg-white/10 px-4 py-2 rounded-full">
            <i class="fas fa-arrow-left"></i> Volver a la Tienda
        </a>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-12">
        <h1 class="text-3xl md:text-4xl font-black text-white uppercase tracking-tight mb-10 flex items-center gap-4">
            <i class="fas fa-shopping-cart text-red-600 drop-shadow-[0_0_10px_rgba(220,38,38,0.5)]"></i> Mi Carrito
        </h1>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- COLUMNA IZQUIERDA: LISTA DE PRODUCTOS -->
            <div class="lg:col-span-7 space-y-4" id="cart-items-container">
                <!-- El contenido se inyecta vía JS -->
                <div class="text-center py-20">
                    <i class="fas fa-circle-notch fa-spin text-red-600 text-3xl"></i>
                </div>
            </div>

            <!-- COLUMNA DERECHA: RESUMEN DEL PEDIDO -->
            <div class="lg:col-span-5">
                <div class="bg-[#150a0a] border border-red-900/30 rounded-2xl p-6 lg:p-8 sticky top-24 shadow-2xl shadow-black/50">
                    <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
                        Resumen del Pedido
                    </h2>
                    
                    <!-- Input de Descuento -->
                    <div class="mb-8">
                        <label class="block text-gray-400 text-xs uppercase font-bold mb-2 tracking-wider">¿Tienes un cupón?</label>
                        <div id="discount-input-container" class="flex gap-2 relative">
                            <input type="text" id="discount-code-input" placeholder="Código de descuento" 
                                class="custom-input w-full bg-[#0d0505] border border-red-900/40 rounded-lg px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none uppercase transition-all">
                            <button onclick="validateAndApplyDiscount()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg text-sm font-bold transition-all shadow-lg shadow-red-900/20 whitespace-nowrap">
                                Aplicar
                            </button>
                        </div>
                        
                        <!-- Estado Descuento Aplicado -->
                        <div id="discount-applied" class="hidden mt-3 p-3 bg-green-900/10 border border-green-600/30 rounded-lg flex items-center justify-between animate-pulse-once">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-check-circle text-green-500"></i>
                                <span class="text-green-400 text-sm font-semibold" id="discount-code-text"></span>
                            </div>
                            <button onclick="removeDiscountCode()" class="text-gray-500 hover:text-red-400 transition-colors"><i class="fas fa-times"></i></button>
                        </div>
                    </div>

                    <!-- Totales -->
                    <div class="space-y-4 mb-8 border-t border-red-900/20 pt-6">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">Subtotal:</span>
                            <span id="cart-subtotal" class="text-white font-medium">$0.00</span>
                        </div>
                        <div id="discount-line" class="hidden flex justify-between text-sm">
                            <span class="text-green-400">Descuento aplicado:</span>
                            <span id="discount-amount" class="text-green-400 font-medium">-$0.00</span>
                        </div>
                        <div class="flex justify-between items-end pt-4 border-t border-red-900/20">
                            <span class="text-gray-300 font-bold text-lg">Total a pagar:</span>
                            <span id="cart-total" class="text-4xl font-black text-white red-glow">$0.00</span>
                        </div>
                    </div>

                    <!-- Botones de Acción Dinámicos -->
                    
                    <!-- 1. Si todo es gratis -->
                    <button id="claim-free-btn" onclick="claimFreeProducts()" class="hidden w-full bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-3 transition-all shadow-lg shadow-emerald-900/30 mb-4 transform hover:-translate-y-1">
                        <i class="fas fa-gift text-xl"></i> Reclamar Productos Gratis
                    </button>

                    <!-- 2. PayPal Container -->
                    <div id="paypal-button-container" class="mb-4 min-h-[150px]"></div>

                    <!-- 3. Pago Manual / Discord -->
                    <button id="manual-checkout-btn" onclick="checkoutManual()" class="hidden w-full bg-[#2c2c2c] hover:bg-[#333] border border-gray-700 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-3 transition-all mb-4 group">
                        <img src="https://assets-global.website-files.com/6257adef93867e56f84d3092/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" class="w-5 h-5 grayscale group-hover:grayscale-0 transition-all" alt="Discord">
                        Pagar Manualmente (Discord)
                    </button>
                    
                    <p class="text-gray-500 text-xs text-center mt-6 flex items-center justify-center gap-2">
                        <i class="fas fa-shield-alt text-gray-600"></i> Pago seguro y entrega instantánea garantizada
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // ========== CONFIGURACIÓN FIREBASE & DISCORD ==========
        const DISCORD_WEBHOOK_URL = "TU_WEBHOOK_AQUI"; // ¡IMPORTANTE! Pon tu webhook real aquí
        const firebaseConfig = {
            apiKey: "AIzaSyBWggE0KFiVZDxwxvmhuWXEKu6bNguV0mM",
            authDomain: "papeletalicencia.firebaseapp.com",
            databaseURL: "https://papeletalicencia-default-rtdb.firebaseio.com",
            projectId: "papeletalicencia",
            storageBucket: "papeletalicencia.firebasestorage.app",
            messagingSenderId: "677208314051",
            appId: "1:677208314051:web:a27c04f31d402e83f29276",
            measurementId: "G-RPJ4KQ6EQ4"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cart = JSON.parse(localStorage.getItem('papeleta_cart') || '[]');
        let currentUser = null;
        let activeDiscount = null;
        let discountPercentage = 0;

        // ========== UTILIDADES ==========
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
            const titles = { success: '¡Éxito!', error: 'Error', warning: 'Atención' };
            
            toast.innerHTML = `
                <i class="fas ${icons[type]} text-xl" style="color: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#f59e0b'}"></i>
                <div class="flex-1">
                    <div class="font-bold text-sm text-white">${titles[type]}</div>
                    <div class="text-xs text-gray-400 mt-1">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, tag => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[tag] || tag));
        }

        // ========== RENDERIZADO DEL CARRITO ==========
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-[#150a0a] border border-dashed border-red-900/30 rounded-2xl flex flex-col items-center">
                        <div class="w-20 h-20 bg-red-900/10 rounded-full flex items-center justify-center mb-6">
                            <i class="fas fa-shopping-basket text-red-500 text-4xl"></i>
                        </div>
                        <h3 class="text-white text-2xl font-bold mb-2">Tu carrito está vacío</h3>
                        <p class="text-gray-400 mb-8 max-w-sm">Parece que aún no has agregado ninguna licencia o producto.</p>
                        <a href="index.html" class="bg-white text-black hover:bg-gray-200 font-bold py-3 px-8 rounded-xl transition-all inline-flex items-center gap-2">
                            Explorar Tienda <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                `;
                updateTotals();
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item rounded-xl p-5 flex items-center gap-5 relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-1 h-full bg-red-600 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <img src="${escapeHTML(item.image || 'https://via.placeholder.com/80')}" alt="${escapeHTML(item.name)}" class="w-24 h-24 object-cover rounded-lg bg-black shadow-md">
                    <div class="flex-grow min-w-0">
                        <h4 class="text-white font-bold text-lg truncate leading-tight mb-1">${escapeHTML(item.name)}</h4>
                        <p class="text-xs text-gray-500 uppercase tracking-wide mb-2">Licencia Digital</p>
                        <p class="${Number(item.price) === 0 ? 'text-emerald-400' : 'text-white'} font-bold text-xl">
                            ${Number(item.price) === 0 ? '<span class="bg-emerald-900/30 text-emerald-400 px-2 py-0.5 rounded text-sm">GRATIS</span>' : '$' + Number(item.price).toFixed(2)}
                        </p>
                    </div>
                    <button onclick="removeFromCart('${item.id}')" class="w-10 h-10 rounded-full bg-transparent hover:bg-red-900/30 text-gray-500 hover:text-red-500 flex items-center justify-center transition-all border border-transparent hover:border-red-900/50">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            `).join('');

            updateTotals();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            localStorage.setItem('papeleta_cart', JSON.stringify(cart));
            renderCart();
            showToast('Producto eliminado', 'warning');
        }

        function updateTotals() {
            const subtotal = cart.reduce((sum, item) => sum + Number(item.price), 0);
            const subtotalEl = document.getElementById('cart-subtotal');
            const totalEl = document.getElementById('cart-total');
            const discountLine = document.getElementById('discount-line');
            const discountAmountEl = document.getElementById('discount-amount');
            const discountApplied = document.getElementById('discount-applied');
            const discountCodeText = document.getElementById('discount-code-text');
            
            // Botones
            const claimBtn = document.getElementById('claim-free-btn');
            const paypalContainer = document.getElementById('paypal-button-container');
            const manualBtn = document.getElementById('manual-checkout-btn');

            subtotalEl.textContent = '$' + subtotal.toFixed(2);

            // Lógica de descuento
            if (activeDiscount && discountPercentage > 0 && subtotal > 0) {
                const discountAmount = subtotal * (discountPercentage / 100);
                const total = subtotal - discountAmount;
                
                discountLine.classList.remove('hidden');
                discountAmountEl.textContent = '-$' + discountAmount.toFixed(2);
                totalEl.textContent = '$' + total.toFixed(2);
                
                discountApplied.classList.remove('hidden');
                discountCodeText.textContent = `${activeDiscount} (-${discountPercentage}%)`;
            } else {
                discountLine.classList.add('hidden');
                totalEl.textContent = subtotal === 0 ? 'GRATIS' : '$' + subtotal.toFixed(2);
                discountApplied.classList.add('hidden');
            }

            // Mostrar/Ocultar botones según el tipo de carrito
            const allFree = cart.every(item => Number(item.price) === 0);
            
            if (allFree && subtotal === 0) { 
                claimBtn.classList.remove('hidden'); 
                paypalContainer.innerHTML = ''; 
                manualBtn.classList.add('hidden'); 
            } else { 
                claimBtn.classList.add('hidden'); 
                renderPayPalButtons(); // Renderiza PayPal si hay precio
                manualBtn.classList.remove('hidden'); 
            }
        }

        // ========== CÓDIGOS DE DESCUENTO ==========
        async function validateAndApplyDiscount() {
            const input = document.getElementById('discount-code-input');
            const code = input.value.trim().toUpperCase();
            if (!code) { showToast('Ingresa un código', 'warning'); return; }

            try {
                // Simulación de consulta a Firestore (ajusta la colección según tu DB real)
                const discountDoc = await db.collection("DiscountCodes").doc(code).get();
                
                if (!discountDoc.exists) { showToast('Código inválido', 'error'); return; }

                const discountData = discountDoc.data();
                if (!discountData.active) { showToast('Este código ha expirado', 'error'); return; }

                activeDiscount = code;
                discountPercentage = discountData.percentage || 0;
                
                input.value = ''; // Limpiar input
                showToast(`¡Código aplicado! ${discountPercentage}% OFF`, 'success');
                updateTotals();
            } catch (error) {
                console.error(error);
                // Fallback para pruebas si no hay DB conectada
                if(code === "TEST10") {
                    activeDiscount = code;
                    discountPercentage = 10;
                    showToast(`Modo prueba: 10% aplicado`, 'success');
                    updateTotals();
                } else {
                    showToast('Error al validar o código no existe', 'error');
                }
            }
        }

        function removeDiscountCode() {
            activeDiscount = null;
            discountPercentage = 0;
            updateTotals();
            showToast('Código eliminado', 'info');
        }

        // ========== PAYPAL & PAGOS ==========
        function renderPayPalButtons() {
            const container = document.getElementById('paypal-button-container');
            container.innerHTML = ''; 
            if (cart.length === 0) return;
            
            const subtotal = cart.reduce((sum, item) => sum + Number(item.price), 0);
            let totalAmount = subtotal;
            
            if (activeDiscount && discountPercentage > 0) {
                totalAmount = subtotal - (subtotal * (discountPercentage / 100));
            }
            
            totalAmount = totalAmount.toFixed(2);

            paypal.Buttons({
                style: { shape: 'rect', color: 'gold', layout: 'vertical', label: 'pay', tagline: false },
                createOrder: function(data, actions) { 
                    return actions.order.create({ 
                        purchase_units: [{ 
                            description: 'Papeleta Store Order', 
                            amount: { value: totalAmount, currency_code: 'USD' } 
                        }] 
                    }); 
                },
                onApprove: function(data, actions) {
                    return actions.order.capture().then(function(details) {
                        showToast('¡Pago exitoso!', 'success');
                        assignProductsToUserAfterPayment(details);
                    });
                },
                onError: function(err) {
                    console.error(err);
                    showToast('Error en el pago', 'error');
                }
            }).render('#paypal-button-container');
        }

        async function claimFreeProducts() {
            if (cart.length === 0) return;
            
            try {
                const purchaseData = {
                    discord_id: currentUser.id, username: currentUser.username, avatar: currentUser.avatar,
                    products: cart.map(item => ({ id: item.id, name: item.name, price: "Gratis" })),
                    total_price: "Gratis", date: firebase.firestore.FieldValue.serverTimestamp(), status: "Reclamado",
                    productImage: cart[0]?.image || null
                };
                
                await db.collection("Clientes").add(purchaseData);
                await sendDiscordNotification(purchaseData, true);
                
                // Generar licencias
                for (const item of cart) { 
                    await getOrCreateLicense(currentUser.id, item.id, item.name); 
                }
                
                showToast('¡Productos añadidos a tu cuenta!', 'success');
                clearCartAndRedirect();
            } catch (error) { 
                console.error(error); 
                showToast('Error al reclamar: ' + error.message, 'error'); 
            }
        }

        async function assignProductsToUserAfterPayment(paymentDetails) {
            try {
                const subtotal = cart.reduce((sum, item) => sum + Number(item.price), 0);
                let total = subtotal;
                let discountInfo = '';
                
                if (activeDiscount && discountPercentage > 0) {
                    total = subtotal - (subtotal * (discountPercentage / 100));
                    discountInfo = ` (${activeDiscount})`;
                }
                
                const purchaseData = {
                    discord_id: currentUser.id, username: currentUser.username, avatar: currentUser.avatar,
                    products: cart.map(item => ({ id: item.id, name: item.name, price: "$" + Number(item.price).toFixed(2) })),
                    total_price: "$" + total.toFixed(2) + discountInfo,
                    payment_id: paymentDetails.id, payer_email: paymentDetails.payer.email_address,
                    date: firebase.firestore.FieldValue.serverTimestamp(), status: "Pagado",
                    productImage: cart[0]?.image || null
                };
                
                await db.collection("Clientes").add(purchaseData);
                await sendDiscordNotification(purchaseData, false);
                
                for (const item of cart) { 
                    await getOrCreateLicense(currentUser.id, item.id, item.name); 
                }
                
                showToast("¡Compra completada!", 'success');
                clearCartAndRedirect();
            } catch (error) { 
                console.error(error); 
                showToast('Error registrando compra', 'error'); 
            }
        }

        function checkoutManual() {
            if (cart.length === 0) return;
            showToast('Redirigiendo a Discord...', 'warning');
            setTimeout(() => { window.open('https://discord.gg/tu-servidor', '_blank'); }, 1000);
        }

        function clearCartAndRedirect() {
            cart = [];
            localStorage.setItem('papeleta_cart', JSON.stringify(cart));
            setTimeout(() => { window.location.href = 'perfil.html'; }, 2000); // Redirigir a perfil o biblioteca
        }

        // ========== BACKEND LOGIC (Licencias & Discord) ==========
        async function getOrCreateLicense(userId, productId, productName) {
            // Lógica simplificada para crear licencia
            const newKey = Array.from({length: 16}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 32)]).join('-');
            const licenseData = { 
                discord_id: userId, product_id: productId, product_name: productName, 
                key: newKey, created_at: firebase.firestore.FieldValue.serverTimestamp(), status: 'active' 
            };
            await db.collection("Licencias").add(licenseData);
        }

        async function sendDiscordNotification(data, isFree) {
            const productNames = data.products.map(p => p.name).join(', ');
            const embedColor = isFree ? 5763719 : 16711680; // Verde o Rojo

            const payload = {
                username: "Papeleta Store Bot",
                embeds: [{
                    title: isFree ? " Nuevo Reclamo" : " Nueva Venta",
                    color: embedColor,
                    fields: [
                        { name: "Usuario", value: `<@${data.discord_id}>`, inline: true },
                        { name: "Total", value: data.total_price, inline: true },
                        { name: "Productos", value: productNames.substring(0, 1024) }
                    ],
                    footer: { text: "ID: " + Date.now() }
                }]
            };

            try {
                await fetch(DISCORD_WEBHOOK_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });
            } catch(e) { console.log("Webhook error", e); }
        }

        // ========== INICIO ==========
        document.addEventListener('DOMContentLoaded', () => {
            // Simulación de usuario logueado (Reemplazar con tu lógica real de Auth)
            // Para probar, descomenta esto:
            /*
            currentUser = { id: "123456", username: "UsuarioPrueba", avatar: null };
            renderCart();
            */

            // Lógica real:
            const savedToken = localStorage.getItem('dc_access_token');
            if (savedToken) {
                fetch('https://discord.com/api/users/@me', { headers: { 'Authorization': `Bearer ${savedToken}` }})
                .then(res => res.json())
                .then(user => {
                    if(user.message) throw new Error("Token inválido");
                    currentUser = user;
                    renderCart();
                })
                .catch(() => {
                    showToast('Sesión expirada. Inicia sesión nuevamente.', 'error');
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                });
            } else {
                showToast('Debes iniciar sesión', 'warning');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            }
        });
    </script>
</body>
</html>
